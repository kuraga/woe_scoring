# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: ["main", "develop"] # More common branch names
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"] # Added latest Python version

    steps:
      - uses: actions/checkout@v4 # Updated to latest version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4 # Updated to latest version
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # Added caching
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest pytest-cov  # Added coverage reporting
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi  # Added dev requirements
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics  # Updated to black standard
      - name: Test with pytest
        run: |
          pytest --cov=./ --cov-report=xml  # Added coverage reporting
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3 # Added coverage upload
        with:
          file: ./coverage.xml
